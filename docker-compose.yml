services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pharmacy_ai
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: pharmacy
    # Hostdagi Windows PostgreSQL 5432 ni egallagan — Docker 5433
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy -d pharmacy_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://pharmacy:pharmacy@postgres:5432/pharmacy_ai
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_MODE: off
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data/uploads:/data/uploads
      - ./lokatsiyalar.txt:/app/data/lokatsiyalar.txt:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  bot:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://pharmacy:pharmacy@postgres:5432/pharmacy_ai
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_MODE: polling
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./data/uploads:/data/uploads
      - ./lokatsiyalar.txt:/app/data/lokatsiyalar.txt:ro
    command: python -m app.bot.runner

volumes:
  postgres_data:
  redis_data:
